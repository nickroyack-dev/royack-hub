<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Royack Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=orangeline">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=orangeline">
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    /* The Hub can't see the phone's safe areas from inside an iframe, so the wrapper pads for it. */
    .wrap { box-sizing: border-box; height: 100vh; height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #0f172a; }
    #fallback { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 12px 16px; font-size: 14px;
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 86vw; }
    #fallback a { color: #60a5fa; font-weight: 700; text-decoration: none; }
    #fallback[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe id="hub" title="Royack Hub"
      data-src="https://script.google.com/macros/s/AKfycbzGTMNUjwg4AY89lfgOy4e8Ij-uge2qp2YE3BE6FUWKibgBXzRqT3H9ZD1-_yPkLw_u/exec"
      allow="clipboard-read; clipboard-write; camera; microphone; fullscreen; screen-wake-lock"
      allowfullscreen referrerpolicy="no-referrer-when-downgrade"
      onload="window.HUB_LOADED = true; var f = document.getElementById('fallback'); if (f) f.hidden = true;"></iframe>
  </div>
  <script>
    // v103: pass ?go=… (e.g. ?go=logfood from the phone widget) through to the Hub inside the iframe.
    (function () {
      var f = document.getElementById('hub'), u = f.getAttribute('data-src');
      var go = (new URLSearchParams(location.search).get('go') || '').replace(/[^a-z-]/gi, '').slice(0, 20);
      f.src = u + (go ? '?go=' + encodeURIComponent(go) : '');
    })();
  </script>
  <div id="fallback" hidden>
    Hub is taking a while to load.<br>
    <a id="direct" href="https://script.google.com/macros/s/AKfycbzGTMNUjwg4AY89lfgOy4e8Ij-uge2qp2YE3BE6FUWKibgBXzRqT3H9ZD1-_yPkLw_u/exec" target="_top" rel="noopener">Open Hub directly</a>
  </div>
  <script>
    // Show "Open Hub directly" only if the iframe hasn't loaded within ~15 s.
    (function () {
      setTimeout(function () { if (!window.HUB_LOADED) document.getElementById('fallback').hidden = false; }, 15000);
    })();
  </script>
  <script>
    // v118 voice bridge: Google's Apps Script sandbox iframe can't use the microphone, so the Hub asks this top page
    // to listen (Web Speech API) and gets the text back by postMessage. Only answers the Hub's own googleusercontent frame.
    (function () {
      var OK = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, peer = null, peerOrigin = '';
      function srJoin(res) {
        // Android Chrome repeats the whole phrase in each result ("6", "6 oz", "6 oz of"…), finals included.
        // Rebuild from scratch every event: a piece that extends the previous one replaces it; a repeat/prefix is dropped.
        var out = [], fin = false;
        for (var i = 0; i < res.length; i++) {
          var t = String(res[i][0] && res[i][0].transcript || '').replace(/\s+/g, ' ').trim(), last = out[out.length - 1];
          fin = !!res[i].isFinal; if (!t) continue;
          if (last != null && t.toLowerCase().indexOf(last.toLowerCase()) === 0) out[out.length - 1] = t;
          else if (last != null && last.toLowerCase().indexOf(t.toLowerCase()) === 0) continue;
          else out.push(t);
        }
        return { text: out.join(' '), final: fin };
      }
      function send(m) { if (peer) try { peer.postMessage(m, peerOrigin); } catch (e) {} }
      function stop() { if (rec) { try { rec.stop(); } catch (e) {} } }
      window.addEventListener('message', function (ev) {
        if (!OK.test(ev.origin) || !ev.data || typeof ev.data !== 'object' || !ev.source) return;
        var d = ev.data; peer = ev.source; peerOrigin = ev.origin;
        if (d.type === 'hub-mic-ping') { send({ type: 'hub-mic-pong', ok: !!SR }); return; }
        if (d.type === 'hub-mic-stop') { stop(); return; }
        if (d.type !== 'hub-mic-start') return;
        if (!SR) { send({ type: 'hub-mic-error', error: 'unsupported' }); return; }
        stop();
        var r = new SR(); rec = r;
        r.lang = 'en-US'; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
        r.onresult = function (e) { var j = srJoin(e.results); send({ type: 'hub-mic-text', text: j.text.slice(0, 600), final: j.final }); }; // full transcript, Hub replaces
        r.onerror = function (e) { send({ type: 'hub-mic-error', error: (e && e.error) || 'error' }); };
        r.onend = function () { if (rec === r) rec = null; send({ type: 'hub-mic-state', on: false }); };
        try { r.start(); send({ type: 'hub-mic-state', on: true }); } catch (e) { send({ type: 'hub-mic-error', error: 'not-allowed' }); }
      });
    })();
  </script>
</body>
</html>
